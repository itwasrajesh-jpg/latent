name: Build Latent APK

on:
  push:
    branches: [main]
    paths-ignore:
      - 'drop/**'
      - '**.md'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Build release APK
        run: gradle assembleRelease --no-daemon -PbuildNumber=${{ github.run_number }}

      - name: Publish to GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK=$(ls app/build/outputs/apk/release/*.apk | head -1)
          cp "$APK" "latent-v${{ github.run_number }}.apk"
          gh release create "v${{ github.run_number }}" \
            "latent-v${{ github.run_number }}.apk" \
            --title "Latent 0.1.${{ github.run_number }}" \
            --notes "Built from ${{ github.sha }} on $(date -u +%Y-%m-%d). Download the APK below and open it to install over the existing app."
